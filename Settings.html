<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tender.Ai</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>

  <body>
    <div class="container">
      <div class="functions">
        <div class="logo">
          <div class="logo1"><span>Tender</span>.Ai</div>
          <div class="logotext">Find , Bid , Win</div>
        </div>
        <div class="Func">
          <i class="fa-solid fa-gauge"></i>
          <a href="index.html">Dashboard</a>
        </div>
        <div class="Func">
          <i class="fa-solid fa-magnifying-glass"></i
          ><a href="Find_Tenders.html">Find Tenders</a>
        </div>
        <div class="Func">
          <i class="fa-solid fa-briefcase"></i
          ><a href="My_Bids.html">My Bids</a>
        </div>
        <div class="Func">
          <i class="fa-solid fa-chart-line"></i
          ><a href="Analytics.html">Analytics</a>
        </div>
        <div class="Func">
          <i class="fa-regular fa-bell"></i><a href="Alert.html">Alert</a>
        </div>
        <div class="sidebar-divider"></div>
        <div class="Func active">
          <i class="fa-solid fa-gear"></i><a href="Settings.html">Settings</a>
        </div>
      </div>
      <div class="main">
        <div class="navbar">
          <div class="searchbar">
            <input type="text" placeholder="Search Tender" />
          </div>

          <i class="fa-regular fa-bell notification"></i>
          <img
            class="profilephoto"
            src="https://res.cloudinary.com/purnesh/image/upload/v1597850424/ti6l5iyewdwzypwzfgj6.png"
            alt="Account profile"
          />
        </div>
        <div class="header">
          <h1>Settings</h1>
          <p>Manage your profile and account details.</p>
        </div>
        <div class="settings-card">
          <div class="settings-card-header">
            <img
              class="profilephoto-lg"
              src="https://res.cloudinary.com/purnesh/image/upload/v1597850424/ti6l5iyewdwzypwzfgj6.png"
              alt="Profile photo"
            />
            <div>
              <h3>Shantanu</h3>
              <p>shantanu@example.com</p>
            </div>
          </div>
        </div>
        <div class="settings-fields">
          <div class="field-group">
            <label>Full Name</label>
            <input type="text" value="Shantanu" />
          </div>
          <div class="field-group">
            <label>Company Name</label>
            <input type="text" placeholder="Enter company name" />
          </div>
          <div class="field-group">
            <label>Email</label>
            <input type="email" value="shantanu@example.com" />
          </div>
        </div>
        <div class="settings-card">
          <h3 class="settings-section-title">Password & Security</h3>
          <div class="settings-fields">
            <div class="field-group">
              <label>Current Password</label>
              <input type="password" placeholder="Enter current password" />
            </div>
            <div class="field-group">
              <label>New Password</label>
              <input type="password" placeholder="Enter new password" />
            </div>
            <div class="field-group">
              <label>Confirm New Password</label>
              <input type="password" placeholder="Re-enter new password" />
            </div>
          </div>
          <button class="bid-btn settings-save-btn">Update Password</button>
        </div>
        <button class="bid-btn settings-save-btn" onclick="saveProfile()">
          Save Changes
        </button>
      </div>
    </div>
  </body>
</html>
