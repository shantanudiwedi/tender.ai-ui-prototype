<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tender.Ai UI Prototype</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>

  <body>
    <div class="container">
      <div class="functions">
        <div class="logo">
          <div class="logo1"><span>Tender</span>.Ai</div>
          <div class="logotext">Find , Bid , Win</div>
        </div>
        <div class="Func active">
          <i class="fa-solid fa-gauge"></i>
          <a href="index.html">Dashboard</a>
        </div>
        <div class="Func">
          <i class="fa-solid fa-magnifying-glass"></i
          ><a href="Find_Tenders.html">Find Tenders</a>
        </div>
        <div class="Func">
          <i class="fa-solid fa-briefcase"></i
          ><a href="My_Bids.html">My Bids</a>
        </div>
        <div class="Func">
          <i class="fa-solid fa-chart-line"></i
          ><a href="Analytics.html">Analytics</a>
        </div>
        <div class="Func">
          <i class="fa-regular fa-bell"></i><a href="Alert.html">Alert</a>
        </div>
        <div class="sidebar-divider"></div>
        <div class="Func">
          <i class="fa-solid fa-gear"></i><a href="Settings.html">Settings</a>
        </div>
      </div>
      <div class="main">
        <div class="navbar">
          <div class="searchbar">
            <input type="text" placeholder="Search Tender" />
          </div>

          <i class="fa-regular fa-bell notification"></i>
          <img
            class="profilephoto"
            src="https://res.cloudinary.com/purnesh/image/upload/v1597850424/ti6l5iyewdwzypwzfgj6.png"
            alt="Account profile"
          />
        </div>

        <div class="cardsbox">
          <div class="card">
            <h3>Total tenders</h3>
            <h2>1248</h2>

            <p><span class="increse">+12%</span> this month</p>
          </div>
          <div class="card">
            <h3>Active tenders</h3>
            <h2>236</h2>

            <p><span class="increse">+12%</span> this month</p>
          </div>
          <div class="card">
            <h3>Bids submitted</h3>
            <h2>89</h2>

            <p><span class="increse">+12%</span> this month</p>
          </div>
          <div class="card">
            <h3>Success ratio</h3>
            <h2>32%</h2>
            <p><span class="increse">+12%</span> this month</p>
          </div>
        </div>
        <img
          class="tenderimg"
          src="pictures/tender_analysis.png"
          alt="analysis"
        />
      </div>
    </div>
  </body>
</html>
